<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>うぶごえライブ</title>
<meta name="description" content="登録者が少なく、ライブ配信の本数もまだ数本の新人VTuberのうち、いま配信中の人を一覧にしています。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 放送局のタリーランプが点くイメージ。上にタイトルと絞り込み、下に配信カードのグリッド */
:root {
  --bg: #f3f2f8;
  --surface: #ffffff;
  --ink: #1b1930;
  --muted: #67637f;
  --line: #e1dfec;
  --accent: #4a3fd1;
  --tally: #e8304b;
  --chip: #ecebf8;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12111c; --surface: #1c1a2b; --ink: #ecebf6; --muted: #a29fbd;
    --line: #2f2c45; --accent: #a69dff; --tally: #ff5a70; --chip: #282540;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  line-height: 1.6;
}
.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: grid; gap: 6px; margin-bottom: 22px; }
.brand { display: flex; align-items: center; gap: 12px; }
.lamp {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--tally);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--tally) 22%, transparent);
  animation: pulse 1.8s ease-in-out infinite;
  flex: none;
}
@keyframes pulse { 50% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--tally) 0%, transparent); } }
h1 {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(1.7rem, 5vw, 2.4rem);
  letter-spacing: .02em;
  margin: 0;
  line-height: 1.15;
}
.lead { margin: 0; color: var(--muted); font-size: .95rem; text-wrap: pretty; }
.meta {
  font-family: var(--mono); font-size: .78rem; color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.controls {
  display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center;
  padding-block: 14px; margin-bottom: 18px;
  border-block: 1px solid var(--line);
}
.group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.group > span { font-size: .8rem; color: var(--muted); letter-spacing: .04em; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button {
  font: inherit; font-size: .85rem; border: 0; background: none; color: var(--ink);
  padding: 5px 12px; cursor: pointer; font-variant-numeric: tabular-nums;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
select {
  font: inherit; font-size: .85rem; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px;
}
button:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
.card {
  display: grid; grid-template-rows: auto 1fr;
  background: var(--surface); border-radius: 12px; overflow: hidden;
  border: 1px solid var(--line); color: inherit; text-decoration: none;
  transition: transform .15s ease, border-color .15s ease;
}
.card:hover { transform: translateY(-2px); border-color: var(--accent); }
.thumb { position: relative; aspect-ratio: 16 / 9; background: var(--chip); max-width: 100%; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.onair {
  position: absolute; left: 8px; top: 8px;
  display: flex; align-items: center; gap: 6px;
  background: var(--tally); color: #fff;
  font-family: var(--mono); font-size: .72rem; letter-spacing: .06em;
  padding: 2px 8px; border-radius: 4px;
}
.onair::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
.elapsed {
  position: absolute; right: 8px; bottom: 8px;
  background: rgba(10, 8, 25, .78); color: #fff;
  font-family: var(--mono); font-size: .72rem; padding: 1px 6px; border-radius: 4px;
}
.body { display: grid; gap: 10px; padding: 12px 14px 14px; align-content: start; min-width: 0; }
.title {
  margin: 0; font-weight: 700; font-size: .95rem; line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  overflow-wrap: anywhere;
}
.who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.icon {
  width: 28px; height: 28px; border-radius: 50%; flex: none; object-fit: cover;
  background: var(--chip); color: var(--accent); display: grid; place-items: center;
  font-size: .8rem; font-weight: 700;
}
.name { font-size: .85rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats { display: flex; gap: 6px; flex-wrap: wrap; }
.stat {
  font-size: .75rem; background: var(--chip); border-radius: 999px; padding: 2px 9px;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.stat b { font-family: var(--mono); font-weight: 500; }
.stat.first { background: var(--tally); color: #fff; }

.empty {
  border: 1px dashed var(--line); border-radius: 12px; padding: 40px 20px;
  text-align: center; color: var(--muted);
}
.empty strong { display: block; color: var(--ink); font-size: 1.05rem; margin-bottom: 4px; }
footer { margin-top: 40px; font-size: .78rem; color: var(--muted); }
footer p { margin: 0 0 4px; }
@media (prefers-reduced-motion: reduce) { .lamp { animation: none; } .card { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="lamp" aria-hidden="true"></span><h1>うぶごえライブ</h1></div>
    <p class="lead" id="lead">いま配信中の、生まれたての新人VTuber。</p>
    <p class="meta" id="meta">データを読み込んでいます…</p>
  </header>

  <div class="controls">
    <div class="group">
      <span>ライブ本数</span>
      <div class="seg" id="liveSeg" role="group" aria-label="ライブ本数の上限"></div>
    </div>
    <div class="group">
      <span>並び順</span>
      <select id="sort">
        <option value="live">ライブ本数が少ない順</option>
        <option value="subs">登録者が少ない順</option>
        <option value="viewers">同接が多い順</option>
        <option value="new">配信開始が新しい順</option>
      </select>
    </div>
  </div>

  <main id="grid" class="grid" aria-live="polite"></main>

  <footer>
    <p>YouTube Data API で1時間ごとに自動更新しています。同接数や登録者数は更新時点の値です。</p>
  </footer>
</div>

<script>
(function () {
  var state = { data: null, maxLive: null, sort: "live" };
  var grid = document.getElementById("grid");

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function ago(iso) {
    if (!iso) return "";
    var m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
    if (m < 60) return m + "分";
    return Math.floor(m / 60) + "時間" + (m % 60 ? (m % 60) + "分" : "");
  }
  function num(n) { return n == null ? "–" : n.toLocaleString("ja-JP"); }

  function buildSeg(max) {
    var seg = document.getElementById("liveSeg");
    seg.innerHTML = "";
    for (var i = 1; i <= max; i++) {
      (function (n) {
        var b = el("button", null, n === max ? "すべて" : n + "本以内");
        b.type = "button";
        b.id = "live-" + n;
        b.setAttribute("aria-pressed", String(n === state.maxLive));
        b.addEventListener("click", function () { state.maxLive = n; buildSeg(max); render(); });
        seg.appendChild(b);
      })(i);
    }
  }

  function card(s) {
    var a = el("a", "card");
    a.href = "https://www.youtube.com/watch?v=" + encodeURIComponent(s.video_id);
    a.target = "_blank"; a.rel = "noopener";

    var t = el("div", "thumb");
    var img = el("img");
    img.src = s.thumbnail || ("https://i.ytimg.com/vi/" + s.video_id + "/mqdefault.jpg");
    img.alt = ""; img.loading = "lazy";
    t.appendChild(img);
    t.appendChild(el("span", "onair", s.viewers == null ? "LIVE" : "LIVE " + num(s.viewers) + "人"));
    if (s.started_at) t.appendChild(el("span", "elapsed", ago(s.started_at) + "経過"));
    a.appendChild(t);

    var b = el("div", "body");
    b.appendChild(el("p", "title", s.title));
    var who = el("div", "who");
    if (s.channel_icon) {
      var ic = el("img", "icon"); ic.src = s.channel_icon; ic.alt = ""; ic.loading = "lazy";
      who.appendChild(ic);
    } else {
      who.appendChild(el("span", "icon", (s.channel || "?").trim().charAt(0)));
    }
    who.appendChild(el("span", "name", s.channel));
    b.appendChild(who);

    var st = el("div", "stats");
    var lc = el("span", "stat" + (s.live_count <= 1 ? " first" : ""));
    lc.innerHTML = "ライブ <b></b> 本目";
    lc.querySelector("b").textContent = s.live_count;
    var sb = el("span", "stat");
    sb.innerHTML = "登録者 <b></b> 人";
    sb.querySelector("b").textContent = num(s.subscribers);
    st.appendChild(lc); st.appendChild(sb);
    b.appendChild(st);
    a.appendChild(b);
    return a;
  }

  function render() {
    var d = state.data;
    grid.innerHTML = "";
    if (!d) return;
    var list = d.streams.filter(function (s) { return s.live_count <= state.maxLive; });
    var cmp = {
      live: function (a, b) { return a.live_count - b.live_count || a.subscribers - b.subscribers; },
      subs: function (a, b) { return a.subscribers - b.subscribers; },
      viewers: function (a, b) { return (b.viewers || 0) - (a.viewers || 0); },
      "new": function (a, b) { return new Date(b.started_at || 0) - new Date(a.started_at || 0); }
    }[state.sort];
    list.sort(cmp);
    if (!list.length) {
      var e = el("div", "empty");
      e.appendChild(el("strong", null, "いま条件に合う配信はありません"));
      e.appendChild(el("span", null, "1時間ごとに更新されます。ライブ本数の条件をゆるめると見つかるかもしれません。"));
      grid.style.display = "block";
      grid.appendChild(e);
      return;
    }
    grid.style.display = "";
    list.forEach(function (s) { grid.appendChild(card(s)); });
  }

  function load() {
    fetch("data.json?t=" + Date.now()).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (d) {
      state.data = d;
      var c = d.conditions || {};
      if (state.maxLive == null) state.maxLive = c.max_live_videos || 5;
      buildSeg(c.max_live_videos || 5);
      document.getElementById("lead").textContent =
        "登録者 " + num(c.max_subscribers) + " 人以内・ライブ配信 " + c.max_live_videos +
        " 本以内で、いま配信中の新人VTuber。";
      document.getElementById("meta").textContent =
        "最終更新 " + ago(d.updated_at) + "前 ／ 配信中 " + num(d.scanned) + " 件から " +
        d.streams.length + " 件";
      render();
    }).catch(function () {
      document.getElementById("meta").textContent = "データを読み込めませんでした。少し待ってから再読み込みしてください。";
    });
  }

  document.getElementById("sort").addEventListener("change", function (e) { state.sort = e.target.value; render(); });
  load();
  setInterval(load, 5 * 60 * 1000);
})();
</script>
</body>
</html>
