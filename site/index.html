<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>うぶごえライブ</title>
<meta name="description" content="個人勢・企業勢VTuberを、登録者・動画・Shorts・ライブ本数・現在の同時接続者数の下限と上限で検索できます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 放送局のタリーランプ。上にタイトルと絞り込みパネル、下に配信カードのグリッド */
:root {
  --bg: #f3f2f8;
  --surface: #ffffff;
  --ink: #1b1930;
  --muted: #67637f;
  --line: #e1dfec;
  --accent: #4a3fd1;
  --on-accent: #ffffff;
  --tally: #e8304b;
  --chip: #ecebf8;
  --off: #8d89a6;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12111c; --surface: #1c1a2b; --ink: #ecebf6; --muted: #a29fbd;
    --line: #2f2c45; --accent: #a69dff; --on-accent: #15131f; --tally: #ff5a70;
    --chip: #282540; --off: #6f6b8c;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.6; }
.wrap {
  max-width: 1180px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; margin-bottom: 20px; }
.head-text { display: grid; gap: 6px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 12px; }
.lamp {
  width: 14px; height: 14px; border-radius: 50%; background: var(--tally); flex: none;
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--tally) 22%, transparent);
  animation: pulse 1.8s ease-in-out infinite;
}
@keyframes pulse { 50% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--tally) 0%, transparent); } }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(1.7rem, 5vw, 2.4rem); letter-spacing: .02em; margin: 0; line-height: 1.15; }
.meta { margin: 0; font-family: var(--mono); font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.btn {
  font: inherit; font-size: .85rem; font-weight: 700; cursor: pointer;
  border: 1px solid var(--accent); color: var(--accent); background: var(--surface);
  border-radius: 999px; padding: 6px 16px; display: inline-flex; align-items: center; gap: 8px;
}
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn:disabled { opacity: .55; cursor: progress; }
.spin { width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px; display: grid; gap: 14px; margin-bottom: 18px;
}
.row { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: end; }
.field { display: grid; gap: 4px; }
.field label, .label { font-size: .75rem; color: var(--muted); letter-spacing: .04em; }
.num { display: flex; align-items: center; gap: 6px; }
.num input {
  width: 6.5em; font: inherit; font-family: var(--mono); font-size: .9rem; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px;
  font-variant-numeric: tabular-nums;
}
.num span { font-size: .8rem; color: var(--muted); white-space: nowrap; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--bg); }
.seg button { font: inherit; font-size: .85rem; border: 0; background: none; color: var(--ink); padding: 6px 14px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
select { font: inherit; font-size: .85rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.hint { margin: 0; font-size: .75rem; color: var(--muted); }
.linkbtn { font: inherit; font-size: .8rem; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; }
input:focus-visible, button:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.count { margin: 0 0 12px; font-size: .9rem; font-variant-numeric: tabular-nums; }
.count b { font-family: var(--mono); font-size: 1.05rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
.card {
  display: grid; grid-template-rows: auto 1fr; background: var(--surface); border-radius: 12px; overflow: hidden;
  border: 1px solid var(--line); color: inherit; text-decoration: none; transition: transform .15s ease, border-color .15s ease;
}
.card:hover { transform: translateY(-2px); border-color: var(--accent); }
.thumb { position: relative; aspect-ratio: 16 / 9; background: var(--chip); max-width: 100%; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card.off .thumb img { filter: saturate(.35); opacity: .8; }
.badge {
  position: absolute; left: 8px; top: 8px; display: flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: .72rem; letter-spacing: .04em; padding: 2px 8px; border-radius: 4px;
  background: var(--tally); color: #fff;
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.card.off .badge { background: rgba(20, 18, 34, .78); color: #d8d5ea; }
.elapsed { position: absolute; right: 8px; bottom: 8px; background: rgba(10, 8, 25, .78); color: #fff; font-family: var(--mono); font-size: .72rem; padding: 1px 6px; border-radius: 4px; }
.body { display: grid; gap: 10px; padding: 12px 14px 14px; align-content: start; min-width: 0; }
.title { margin: 0; font-weight: 700; font-size: .95rem; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.card.off .title { font-weight: 500; color: var(--muted); }
.who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.icon { width: 28px; height: 28px; border-radius: 50%; flex: none; object-fit: cover; background: var(--chip); color: var(--accent); display: grid; place-items: center; font-size: .8rem; font-weight: 700; }
.name { font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; border-top: 1px solid var(--line); padding-top: 10px; }
.stat { display: grid; gap: 0; text-align: center; }
.stat small { font-size: .68rem; color: var(--muted); }
.stat b { font-family: var(--mono); font-weight: 500; font-size: .9rem; font-variant-numeric: tabular-nums; }
.empty { grid-column: 1 / -1; border: 1px dashed var(--line); border-radius: 12px; padding: 40px 20px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-size: 1.05rem; margin-bottom: 4px; }

footer { margin-top: 40px; font-size: .78rem; color: var(--muted); display: grid; gap: 10px; }
footer p { margin: 0; }
.admin { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; max-width: 560px; }
.admin input { font: inherit; font-family: var(--mono); font-size: .8rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%; min-width: 0; }
.status { font-size: .85rem; color: var(--ink); margin: 0; }
.status.err { color: var(--tally); }
@media (prefers-reduced-motion: reduce) { .lamp, .spin { animation: none; } .card { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-text">
      <div class="brand"><span class="lamp" aria-hidden="true"></span><h1>うぶごえライブ</h1></div>
      <p class="meta" id="meta">データを読み込んでいます…</p>
      <p class="hint" id="freshnessWarning" role="status" hidden></p>
    </div>
    <div id="refreshBox" hidden>
      <button class="btn primary" id="refreshBtn" type="button">今すぐ更新</button>
    </div>
  </header>
  <p class="status" id="refreshStatus" hidden></p>

  <section class="panel" aria-label="絞り込み">
    <div class="row">
      <div class="field">
        <span class="label">配信状態</span>
        <div class="seg" role="group" aria-label="配信状態">
          <button type="button" id="st-live" data-st="live">配信中</button>
          <button type="button" id="st-off" data-st="off">配信していない</button>
          <button type="button" id="st-all" data-st="all">すべて</button>
        </div>
      </div>
      <div class="field">
        <label for="sort">並び順</label>
        <select id="sort">
          <option value="lives">ライブ本数が少ない順</option>
          <option value="subs">登録者が少ない順</option>
          <option value="viewers">同接が多い順</option>
          <option value="recent">最近配信した順</option>
          <option value="new">新しく見つかった順</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field"><label for="f-subs-min">登録者数</label><div class="num"><input id="f-subs-min" type="number" min="0" inputmode="numeric" placeholder="下限" aria-label="登録者数の最小値"><span>〜</span><input id="f-subs-max" type="number" min="0" inputmode="numeric" placeholder="上限" aria-label="登録者数の最大値"><span>人</span></div></div>
      <div class="field"><label for="f-lives-min">ライブ</label><div class="num"><input id="f-lives-min" type="number" min="0" inputmode="numeric" placeholder="下限" aria-label="ライブの最小値"><span>〜</span><input id="f-lives-max" type="number" min="0" inputmode="numeric" placeholder="上限" aria-label="ライブの最大値"><span>本</span></div></div>
      <div class="field"><label for="f-videos-min">動画</label><div class="num"><input id="f-videos-min" type="number" min="0" inputmode="numeric" placeholder="下限" aria-label="動画の最小値"><span>〜</span><input id="f-videos-max" type="number" min="0" inputmode="numeric" placeholder="上限" aria-label="動画の最大値"><span>本</span></div></div>
      <div class="field"><label for="f-shorts-min">ショート</label><div class="num"><input id="f-shorts-min" type="number" min="0" inputmode="numeric" placeholder="下限" aria-label="ショートの最小値"><span>〜</span><input id="f-shorts-max" type="number" min="0" inputmode="numeric" placeholder="上限" aria-label="ショートの最大値"><span>本</span></div></div>
      <div class="field"><label for="f-viewers-min">現在の同時接続者数</label><div class="num"><input id="f-viewers-min" type="number" min="0" inputmode="numeric" placeholder="下限" aria-label="現在の同時接続者数の最小値"><span>〜</span><input id="f-viewers-max" type="number" min="0" inputmode="numeric" placeholder="上限" aria-label="現在の同時接続者数の最大値"><span>人</span></div></div>
    </div>
    <p class="hint">空欄にするとその条件は使いません。<button class="linkbtn" id="reset" type="button">初期値に戻す</button></p>
  </section>

  <p class="count" id="count"></p>
  <p class="hint" id="dataQuality"></p>
  <main id="grid" class="grid" aria-live="polite"></main>
  <div class="row" style="justify-content:center;margin-top:18px">
    <button class="btn" id="showMore" type="button" hidden>さらに表示</button>
  </div>

  <footer>
    <p id="about">日本のVTuber（個人勢・企業勢）を収集中です。配信状況は約1時間ごとに更新するため、現在のYouTubeの状態と異なる場合があります。全チャンネルの網羅は保証していません。</p>
    <p><button class="linkbtn" id="adminToggle" type="button">管理者メニュー</button></p>
    <div class="admin" id="admin" hidden>
      <p class="status">「今すぐ更新」ボタンを使うには、GitHubのアクセストークンをこのブラウザに保存します。トークンはこのブラウザの中だけに保存され、ほかの人には見えません。</p>
      <div class="field"><label for="token">GitHubトークン（Actions: Read and write）</label><input id="token" type="password" autocomplete="off" placeholder="github_pat_..."></div>
      <div class="row"><button class="btn primary" id="saveToken" type="button">保存</button><button class="btn" id="clearToken" type="button">削除</button></div>
      <p class="status" id="adminMsg"></p>
    </div>
  </footer>
</div>

<script>
(function () {
  var DEFAULTS = { st: "live", sort: "viewers",
    subsMin: "", subsMax: "", livesMin: "", livesMax: "",
    videosMin: "", videosMax: "", shortsMin: "", shortsMax: "",
    viewersMin: "", viewersMax: "" };
  var KEY = "ubugoe-filters", TOKEN_KEY = "ubugoe-gh-token";
  var parts = location.hostname.split(".");
  var OWNER = parts[1] === "github" ? parts[0] : "takuminurufff-collab";
  var REPO = location.pathname.split("/").filter(Boolean)[0] || "vtuber-live-finder";

  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  var f = Object.assign({}, DEFAULTS);
  try {
    var stored = JSON.parse(read(KEY) || "{}");
    // 古い「○以内」の保存値を上限の指定として引き継ぐ。
    ["subs", "lives", "videos", "shorts", "viewers"].forEach(function (k) {
      if (stored[k + "Max"] == null && stored[k] !== "" && stored[k] != null) stored[k + "Max"] = stored[k];
    });
    Object.assign(f, stored);
  } catch (e) {}
  var data = null;
  var shownLimit = 300;
  var $ = function (id) { return document.getElementById(id); };
  var FIELDS = ["subs", "lives", "videos", "shorts", "viewers"];
  var METRICS = { subs: "subscribers", lives: "lives", videos: "videos", shorts: "shorts" };

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function num(n) { return n == null ? "–" : Number(n).toLocaleString("ja-JP"); }
  function ago(iso) {
    if (!iso) return null;
    var when = Date.parse(iso);
    if (!Number.isFinite(when)) return null;
    var m = Math.max(0, Math.round((Date.now() - when) / 60000));
    if (m < 60) return m + "分";
    var h = Math.floor(m / 60);
    if (h < 24) return h + "時間" + (m % 60 ? (m % 60) + "分" : "");
    return Math.floor(h / 24) + "日";
  }

  // 時刻不明や最終更新から2時間以上のデータをライブの現況として扱わない。
  function updateFreshness(updatedAt) {
    var node = $("freshnessWarning");
    var age = Date.now() - Date.parse(updatedAt);
    var stale = !Number.isFinite(age) || age > 2 * 60 * 60 * 1000;
    node.hidden = !stale;
    node.textContent = stale
      ? "データの更新が遅れています。配信中・同時接続者数は現在の状況と異なる可能性があります。"
      : "";
  }

  function syncControls() {
    ["live", "off", "all"].forEach(function (s) { $("st-" + s).setAttribute("aria-pressed", String(f.st === s)); });
    $("sort").value = f.sort;
    FIELDS.forEach(function (k) { ["Min", "Max"].forEach(function (side) { $("f-" + k + "-" + side.toLowerCase()).value = f[k + side]; }); });
  }
  function save() { store(KEY, JSON.stringify(f)); }

  function passes(c) {
    if (f.st === "live" && !c.is_live) return false;
    if (f.st === "off" && c.is_live !== false) return false;
    for (var i = 0; i < FIELDS.length; i++) {
      var k = FIELDS[i], min = f[k + "Min"], max = f[k + "Max"];
      if ((min === "" || min == null) && (max === "" || max == null)) continue;
      var value = k === "viewers" ? (c.is_live && c.live ? c.live.viewers : null) : c[METRICS[k]];
      // 0は有効な値だが、未取得・非公開・未配信は0扱いしない。
      if (value == null || !Number.isFinite(Number(value))) return false;
      var n = Number(value);
      if (min !== "" && min != null && n < Number(min)) return false;
      if (max !== "" && max != null && n > Number(max)) return false;
    }
    return true;
  }

  function card(c) {
    var live = c.is_live && c.live;
    var a = el("a", "card" + (live ? "" : " off"));
    a.href = live ? "https://www.youtube.com/watch?v=" + encodeURIComponent(c.live.video_id)
                  : "https://www.youtube.com/channel/" + encodeURIComponent(c.id) + "/streams";
    a.target = "_blank"; a.rel = "noopener";

    var t = el("div", "thumb");
    var src = live ? c.live.thumbnail || ("https://i.ytimg.com/vi/" + c.live.video_id + "/mqdefault.jpg")
                   : c.latest ? c.latest.thumbnail || ("https://i.ytimg.com/vi/" + c.latest.video_id + "/mqdefault.jpg") : null;
    if (src) { var img = el("img"); img.src = src; img.alt = ""; img.loading = "lazy"; t.appendChild(img); }
    if (live) {
      t.appendChild(el("span", "badge", c.live.viewers == null ? "LIVE" : "LIVE " + num(c.live.viewers) + "人"));
      if (c.live.started_at) {
        var elapsed = ago(c.live.started_at);
        if (elapsed != null) t.appendChild(el("span", "elapsed", elapsed + "経過"));
      }
    } else {
      var lastLiveAgo = ago(c.last_live_at);
      t.appendChild(el("span", "badge", c.is_live == null ? "配信状況を確認中" : (lastLiveAgo != null ? "最終配信 " + lastLiveAgo + "前" : (c.last_live_at ? "最終配信時刻不明" : "配信していません"))));
    }
    a.appendChild(t);

    var b = el("div", "body");
    b.appendChild(el("p", "title", live ? c.live.title : (c.latest ? c.latest.title : "最新の動画はまだありません")));
    var who = el("div", "who");
    if (c.icon) { var ic = el("img", "icon"); ic.src = c.icon; ic.alt = ""; ic.loading = "lazy"; who.appendChild(ic); }
    else who.appendChild(el("span", "icon", (c.name || "?").trim().charAt(0)));
    who.appendChild(el("span", "name", c.name));
    b.appendChild(who);

    var st = el("div", "stats");
    [["登録者", c.subscribers], ["ライブ", c.lives], ["動画", c.videos], ["ショート", c.shorts]].forEach(function (p) {
      var s = el("div", "stat"); s.appendChild(el("small", null, p[0])); s.appendChild(el("b", null, num(p[1]))); st.appendChild(s);
    });
    b.appendChild(st);
    a.appendChild(b);
    return a;
  }

  function render() {
    var grid = $("grid");
    grid.innerHTML = "";
    if (!data) return;
    var list = data.channels.filter(passes);
    // 数値不明は0人ではない。昇順では必ず末尾にする。
    function ascendingKnown(a, b) {
      // Keep unknown values last, including when both values are unknown.
      var aMissing = a == null, bMissing = b == null;
      if (aMissing || bMissing) return Number(aMissing) - Number(bMissing);
      return Number(a) - Number(b);
    }
    function viewerCount(c) { return c.is_live && c.live ? c.live.viewers : null; }
    function descendingKnown(a, b) { return ascendingKnown(b, a) * (a == null || b == null ? -1 : 1); }
    var cmp = {
      lives: function (a, b) { return ascendingKnown(a.lives, b.lives) || ascendingKnown(a.subscribers, b.subscribers); },
      subs: function (a, b) { return ascendingKnown(a.subscribers, b.subscribers); },
      viewers: function (a, b) { return descendingKnown(viewerCount(a), viewerCount(b)); },
      recent: function (a, b) { return Number(b.is_live === true) - Number(a.is_live === true) || new Date(b.last_live_at || 0) - new Date(a.last_live_at || 0); },
      "new": function (a, b) { return new Date(b.first_seen || 0) - new Date(a.first_seen || 0); }
    }[f.sort] || function () { return 0; };
    list.sort(cmp);
    var total = data.channels.length, liveN = data.channels.filter(function (c) { return c.is_live === true; }).length;
    var unknownLiveN = data.channels.filter(function (c) { return c.is_live == null; }).length;
    var missingCounts = data.channels.filter(function (c) { return c.videos == null || c.shorts == null || c.lives == null; }).length;
    var privateSubscribers = data.channels.filter(function (c) { return c.subscribers == null; }).length;
    $("count").innerHTML = "";
    $("count").append("蓄積 ", el("b", null, num(total)), " チャンネル（配信中 " + liveN + (unknownLiveN ? "・配信状況未確認 " + unknownLiveN : "") + "）のうち、条件に合うのは ", el("b", null, num(list.length)), " 件");
    $("dataQuality").textContent =
      (missingCounts ? "動画・Shorts・ライブ本数が未取得：" + num(missingCounts) + "件。 " : "") +
      (privateSubscribers ? "登録者数が非公開または未取得：" + num(privateSubscribers) + "件。 " : "") +
      ((missingCounts || privateSubscribers) ? "不明な項目に数値条件を指定すると該当チャンネルは検索対象から外れます。" : "");
    $("showMore").hidden = list.length <= shownLimit;
    $("showMore").textContent = "さらに表示（" + num(Math.min(300, Math.max(0, list.length - shownLimit))) + "件）";
    if (!list.length) {
      var e = el("div", "empty");
      e.appendChild(el("strong", null, "条件に合うチャンネルはありません"));
      e.appendChild(el("span", null, f.st === "live" ? "今は配信していないのかもしれません。「すべて」に切り替えるか、数字の条件をゆるめてみてください。" : "数字の条件をゆるめてみてください。"));
      grid.appendChild(e);
      return;
    }
    list.slice(0, shownLimit).forEach(function (c) { grid.appendChild(card(c)); });
  }

  function load(minUpdatedAt) {
    return fetch("data.json?t=" + Date.now()).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (d) {
      // 管理者の手動更新後は、更新前と同じJSONを最新として扱わない。
      // 無効な更新日時も含め、配信キャッシュが古ければ失敗として知らせる。
      // Validate the complete response before reading properties or replacing cards.
      // A 200 response may still contain a partial or malformed dataset.
      if (!d || !Array.isArray(d.channels) || !Number.isFinite(Date.parse(d.updated_at)) ||
          Date.parse(d.updated_at) > Date.now() + 5 * 60 * 1000 ||
          d.channels.some(function (c) {
            return !c || typeof c.id !== "string" || !/^UC[A-Za-z0-9_-]{22}$/.test(c.id) ||
              typeof c.name !== "string" ||
              (c.is_live !== null && typeof c.is_live !== "boolean") ||
              ["subscribers", "videos", "shorts", "lives"].some(function (key) {
                return c[key] != null && (!Number.isSafeInteger(c[key]) || c[key] < 0);
              }) ||
              (c.is_live === true && (!c.live || typeof c.live.video_id !== "string" ||
                !/^[A-Za-z0-9_-]{11}$/.test(c.live.video_id) ||
                (c.live.viewers != null && (!Number.isSafeInteger(c.live.viewers) || c.live.viewers < 0))));
          }) || new Set(d.channels.map(function (c) { return c.id; })).size !== d.channels.length) {
        throw new Error("Invalid published dataset");
      }
      if (minUpdatedAt != null && !(Date.parse(d.updated_at) > minUpdatedAt)) {
        throw new Error("Dataset has not advanced");
      }
      data = d;
      var elapsed = ago(d.updated_at);
      $("meta").textContent = elapsed == null ? "最終更新日時を確認できません" : "最終更新 " + elapsed + "前";
      updateFreshness(d.updated_at);
      render();
      return true;
    }).catch(function () {
      $("meta").textContent = "データを読み込めませんでした。少し待ってから再読み込みしてください。";
      $("freshnessWarning").hidden = false;
      $("freshnessWarning").textContent = "最新データを確認できません。表示中の配信情報は古い可能性があります。";
      return false;
    });
  }

  // ---- 操作 ----
  document.querySelectorAll("[data-st]").forEach(function (b) {
    b.addEventListener("click", function () { f.st = b.dataset.st; shownLimit = 300; syncControls(); save(); render(); });
  });
  $("sort").addEventListener("change", function (e) { f.sort = e.target.value; shownLimit = 300; save(); render(); });
  FIELDS.forEach(function (k) {
    ["Min", "Max"].forEach(function (side) {
      $("f-" + k + "-" + side.toLowerCase()).addEventListener("input", function (e) {
        f[k + side] = e.target.value; shownLimit = 300; save(); render();
      });
    });
  });
  $("reset").addEventListener("click", function () { f = Object.assign({}, DEFAULTS); shownLimit = 300; syncControls(); save(); render(); });
  $("showMore").addEventListener("click", function () { shownLimit += 300; render(); });

  // ---- 管理者：今すぐ更新 ----
  function token() { return read(TOKEN_KEY); }
  function showRefresh() { $("refreshBox").hidden = !token(); }
  $("adminToggle").addEventListener("click", function () { $("admin").hidden = !$("admin").hidden; });
  $("saveToken").addEventListener("click", function () {
    var v = $("token").value.trim();
    if (!v) { $("adminMsg").textContent = "トークンを入力してください。"; return; }
    store(TOKEN_KEY, v); $("token").value = "";
    $("adminMsg").textContent = "保存しました。ページ上部に「今すぐ更新」ボタンが出ます。";
    showRefresh();
  });
  $("clearToken").addEventListener("click", function () {
    store(TOKEN_KEY, null); $("adminMsg").textContent = "このブラウザからトークンを削除しました。"; showRefresh();
  });

  function gh(path, opts) {
    opts = opts || {};
    return fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + path, {
      method: opts.method || "GET",
      headers: { "Authorization": "Bearer " + token(), "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
  }
  function setStatus(text, err) { var s = $("refreshStatus"); s.hidden = !text; s.textContent = text || ""; s.className = "status" + (err ? " err" : ""); }

  $("refreshBtn").addEventListener("click", function () {
    var btn = $("refreshBtn"), started = Date.now();
    var previousUpdatedAt = data ? Date.parse(data.updated_at) : NaN;
    var requiredNewerThan = Number.isFinite(previousUpdatedAt) ? previousUpdatedAt : 0;
    btn.disabled = true; btn.innerHTML = '<span class="spin" aria-hidden="true"></span>更新中…';
    setStatus("YouTubeから取得しています。1〜3分かかります。");
    function done(msg, err) { btn.disabled = false; btn.textContent = "今すぐ更新"; setStatus(msg, err); }

    // Actionsのdispatch応答にはrun IDがないため、入力した固有IDを
    // workflowのrun-nameに埋め、同時実行でも自分の更新だけを追跡する。
    var requestId = (window.crypto && window.crypto.randomUUID)
      ? window.crypto.randomUUID() : Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
    var expectedTitle = "配信データ更新 [" + requestId + "]";
    gh("/actions/workflows/update.yml/dispatches", {
      method: "POST", body: { ref: "main", inputs: { request_id: requestId } }
    }).then(function (r) {
      if (r.status === 401 || r.status === 403) throw new Error("トークンが無効か、Actionsの書き込み権限がありません。管理者メニューから保存し直してください。");
      if (r.status !== 204) throw new Error("更新を開始できませんでした（" + r.status + "）。");
      var tries = 0;
      (function poll() {
        tries++;
        gh("/actions/workflows/update.yml/runs?event=workflow_dispatch&branch=main&per_page=30").then(function (r) {
          if (!r.ok) throw new Error("更新履歴の取得に失敗しました");
          return r.json();
        }).then(function (j) {
          var runs = j.workflow_runs || [];
          var run = runs.find(function (r) { return r.display_title === expectedTitle; });
          var fresh = run && new Date(run.created_at).getTime() >= started - 60000;
          if (fresh && run.status === "completed") {
            if (run.conclusion !== "success") return done("更新に失敗しました。GitHubのActions画面でエラーを確認してください。", true);
            setStatus("GitHubの更新が完了しました。公開データへの反映を確認しています…");
            var verifyTries = 0;
            (function verifyPublished() {
              verifyTries++;
              load(requiredNewerThan).then(function (loaded) {
                if (loaded) {
                  done("更新しました。");
                  setTimeout(function () { setStatus(""); }, 4000);
                } else if (verifyTries >= 12) {
                  done("GitHubの更新は成功しましたが、公開データの反映を確認できませんでした。少し待ってページを再読み込みしてください。", true);
                } else {
                  setStatus("公開データの反映を待っています…（確認 " + verifyTries + "/12）");
                  setTimeout(verifyPublished, 10000);
                }
              });
            })();
          } else if (tries > 40) {
            done("時間がかかっています。少し待ってからページを再読み込みしてください。", true);
          } else setTimeout(poll, 8000);
        }).catch(function () {
          if (tries >= 40) return done("GitHubの実行状況を確認できませんでした。Actions画面をご確認ください。", true);
          setTimeout(poll, 8000);
        });
      })();
    }).catch(function (e) { done(e.message, true); });
  });

  syncControls();
  showRefresh();
  load();
  setInterval(load, 5 * 60 * 1000);
})();
</script>
</body>
</html>
