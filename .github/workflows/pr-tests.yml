name: Pull request tests

on:
  push:
    branches: ['feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pull request code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests
      - name: Verify Python syntax
        run: python -m compileall -q finder.py tests
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Run JavaScript filter tests
        run: node --test tests/test_filters.cjs
      - name: Validate saved VTuber dataset
        run: node --test tests/test_dataset.cjs
      - name: Install browser-DOM test dependency
        run: npm install --no-save --no-audit --no-fund jsdom@26
      - name: Run DOM interaction tests
        run: node --test tests/test_ui.cjs
      - name: Install real Chromium browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run desktop and mobile Chromium smoke tests
        run: python tests/browser_smoke.py

  public-site-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check published site and dataset are reachable
        shell: bash
        run: |
          set -euo pipefail
          base="https://takuminurufff-collab.github.io/vtuber-live-finder"
          curl --fail --location --retry 3 --retry-delay 3 --max-time 20 --silent --show-error "$base/" -o /tmp/vtuber-index.html
          grep -q 'うぶごえライブ' /tmp/vtuber-index.html
          curl --fail --location --retry 3 --retry-delay 3 --max-time 20 --silent --show-error "$base/data.json" -o /tmp/vtuber-data.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/vtuber-data.json').read_text())
          assert isinstance(data.get('channels'), list) and len(data['channels']) > 0, 'Empty public catalog'
          assert isinstance(data.get('updated_at'), str), 'Missing public update timestamp'
          print(f"Public site reachable, {len(data['channels'])} VTubers in catalog")
          PY
