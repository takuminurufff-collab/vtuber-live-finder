name: 配信データ更新

on:
  schedule:
    # 1時間おき（毎時23分・UTC）。API枠は finder.py が1日分を均等に配分する
    - cron: "23 * * * *"
  workflow_dispatch:   # ページの「今すぐ更新」ボタン、またはActions画面の「Run workflow」から実行
  push:
    branches: [main]
    paths-ignore: ["data/**", "site/data.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Python構文を検証
        run: python -m compileall -q finder.py tests

      - name: Python単体テスト
        run: python -m unittest discover -s tests -v

      - name: ブラウザ検索と保存データを検証
        run: |
          node --test tests/test_filters.cjs tests/test_dataset.cjs
          npm install --no-save --no-audit --no-fund jsdom@26
          node --test tests/test_ui.cjs

      - name: YouTubeから取得
        id: collect
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          POOL_MAX_SUBSCRIBERS: ${{ vars.POOL_MAX_SUBSCRIBERS || '1000000000' }}
          DAILY_BUDGET: ${{ vars.DAILY_BUDGET || '9300' }}
        run: python finder.py

      - name: API取得エラー時にも消費済み枠だけ保存
        if: ${{ failure() && steps.collect.outcome == 'failure' }}
        run: |
          # 本体の例外処理が保存したquotaのみを持続化する。
          # 途中の検索カーソルや未完成のDBを保存しない。
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "API失敗時の消費枠を記録"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main

      - name: 新しく取得したデータを公開前に検証
        run: node --test tests/test_dataset.cjs

      - name: 蓄積データを保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/channels.json data/state.json site/data.json
          git diff --cached --quiet || git commit -m "データ更新 $(date -u +%Y-%m-%dT%H:%MZ)"
          # 更新失敗を隠すと、古いデータのまま正常終了と誤表示される。
          # 競合時はデプロイせず失敗として通知する。
          git pull --rebase -X theirs origin main
          git push origin HEAD:main

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
